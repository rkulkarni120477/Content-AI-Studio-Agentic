[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-ai-api"
version = "1.0.0"
description = "Content AI Studio — FastAPI backend for eLearning content generation"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",   # file uploads

    # --- Database ---
    "sqlalchemy>=2.0",
    "alembic>=1.16",  # if_not_exists on create_index/drop_index (used by migrations 25+) needs 1.16+
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.2,<4",   # DIS structure_store (services/indexing.py) uses psycopg v3

    # --- Config & validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",

    # --- Auth ---
    "PyJWT>=2.9",

    # --- LLM providers ---
    "requests>=2.32",
    "boto3>=1.35",
    "botocore>=1.35",
    "json-repair>=0.25",

    # --- Vector store (OpenSearch) ---
    "opensearch-py>=2.6,<3",
    "requests-aws4auth>=1.3",

    # --- Background jobs ---
    "celery>=5.4",
    "redis>=5.2",

    # --- Export ---
    "python-docx>=1.1",
    "pypdf>=4.2",
    "openpyxl>=3.1",

    # --- Document extraction ---
    "python-pptx>=1.0",   # PPTX extraction (dis_backend extractors, file_parser)
    "pypdfium2>=4.30",    # mandatory PDF path above PDF_LARGE_BYTES; last-resort fallback
    "tiktoken>=0.8",      # token counting in promptops_app.core.config

    # --- Sanitization / filesystem watch (unguarded top-level imports) ---
    "nh3>=0.2",           # promptops_app.services.content_sanitizer
    "watchdog>=4.0",      # dis_backend.deploy.folder_watcher

    # --- Utilities ---
    "pandas>=2.2",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",          # async test client for FastAPI
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.12",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# Packaging — flat layout, so name the importable packages explicitly.
# Without this, setuptools aborts on the sibling asset dirs (logs/, data/,
# frontend/, node_modules/, …) it discovers at the repo root.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["app*", "promptops_app*", "config*"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter (replaces Black + Flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (Depends() pattern)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use assert statements and magic values freely.
"tests/*" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

# ---------------------------------------------------------------------------
# Mypy — optional static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
exclude = ["migrations/", "tests/"]
