# Pre-commit hooks — run automatically before every git commit.
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:

  # Ruff: linter + formatter (replaces Black, Flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]          # auto-fix safe issues
      - id: ruff-format        # format code

  # Prevent committing to main/master directly
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
