  local:
    base_path: /unused/s3-only
retrieval:
  # Ceiling on the units a caller may request (clamps `retrieval.top_k`; its only
  # use). Raised from 20 so a structural document can be retrieved WHOLE.
  #
  # A block's 20-day course calendar is 20 units on its own, so at 20 every
  # other document competed with it for slots: a CDD regeneration asking about
  # handbooks got both syllabi (1 unit each) plus 8 student-calendar sections,
  # leaving 10 slots for a 20-day calendar. Half a calendar cannot answer a
  # question about what Day 14 assumes Day 13 established.
  #
  # Safe for the other purposes because `token_budget` binds first: _pack_units
  # skips a unit that would exceed the budget and only then checks this count, so
  # a caller sending the 6,000-token default still receives ~6,000 tokens — just
  # potentially more, smaller units within it. Only the CDD path raises its own
  # token_budget to match. 40 stays under result_size_cap (50).
  #
  # Measured across all 14 blocks carrying cdd-purpose material: unit counts of
  # 1, 8, 12, 30, 32, 41 (x6) and 49, token totals peaking at ~7,900. 40 would
  # have truncated the seven blocks at 41+, so this is the measured maximum (49)
  # rounded to result_size_cap.
  max_results: 50
  result_size_cap: 50
  restricted_content_filter: true

  purpose_labels:
    style: Style Reference Documents
    cdd: Course Design Sources
    blueprint: Calendar / Block Sources
    course_generation: Lesson Source Materials
  source_ui:
    common_filters:
      - purpose
      - document_type
      - visibility
      - status
      - search
    taxonomy_filters:
      - key: course_name
        label: Course
        type: select
      - key: block
        label: Block
        type: select
      - key: day
        label: Day
        type: select
      - key: topic
        label: Topic
        type: text
    upload:
      fields:
        - key: document_type
          label: Document Type
          control: select
        - key: chapter
          label: Chapter
          control: text
          order: 1
        - key: module_name
          label: Module
          control: text
          order: 2
        - key: learning_objective
          label: Learning Objective
          control: text
          order: 3
  source_type_mapping:
    style:
      - style_guide
      - authoring_guide
      - authoring_guidelines
      - sample_lesson
      - approved_template
    cdd:
      - syllabus
      - course_outline
      - course_calendar
      - program_overview
      - learning_objectives
      # Knowledge-test performance data is course-design input: it is what makes a
      # CDD's remediation and quick-check decisions evidence-based rather than
      # guessed.
      - knowledge_test_report
    blueprint:
      - course_calendar
      - block_schedule
      - syllabus
      - lesson_plan
      - knowledge_test_report
    course_generation:
      # Pipeline-era classification names (kept for backward compatibility).
      - lesson_plan
      - lesson_slide_deck
      - project_activity
      - quiz_exam
      - student_handout
      - ebook_reference
      # Actual Source Library doc types produced for AIM (must be listed here or
      # course-generation retrieval finds nothing). Mirrors
      # aim_content_rules.course_generation_source_types below.
      - lesson_pdf
      - slide_deck
      - quiz
      - final_exam
      - project
      - hangar_activity
      - study_questions
security:
  require_jwt: true
  jwt_audience: aim-dis-api
monitoring:
  slo_ingestion_p95_ms: 10000
  slo_retrieval_p95_ms: 500
embedding:
  enabled: true
  provider: bedrock
  model_id: amazon.titan-embed-text-v2:0
  dimension: 1024
  region: us-east-1
  # Titan v2's hard limit is 8,192 TOKENS. 50000 chars is roughly 12,500 tokens, so
  # a long unit was rejected with "Too many input tokens" — and because a failed
  # embedding fell through to indexing the unit with an empty vector, the document
  # landed in the index unfindable by semantic search, with the job reporting
  # success. 24000 keeps the worst realistic ratio (~3 chars/token) under the limit.
  # Clipping is logged; see generate_embeddings.
  max_input_chars: 24000
document_processing:
  profile: aviation_academic
  enabled_document_types:
  - course_calendar
  - syllabus
  - lesson_slide_deck
  - project_activity
  - project_key
  - quiz_exam
  - quiz_answer_key
  - study_questions
  - ebook_reference
  - instructor_guide
  - student_handout
  # AKTR (Airman Knowledge Test Report) missed-code rollups: aggregate exam
  # PERFORMANCE data, not exam content. Deliberately not in
  # restricted_document_types below — it carries no questions and no answers, and
  # a Blueprint cannot print real "Targets for Quick Check" without it.
  - knowledge_test_report
  - other
  document_type_rules:
  - doc_type: syllabus
    filename_keywords:
    - syllabus
    text_keywords:
    - syllabus
    - course description
    - course objectives
    - grading and evaluation
    - attendance policy
    priority: 10
  - doc_type: course_calendar
    filename_keywords:
    - calendar
    - teacher calendar
    - student version
    text_keywords:
    - course calendar
    - week/lesson
    - day 1
    - day 2
    - corresponding assignment
    - topics covered
    priority: 20
  # Ahead of quiz_answer_key: an AKTR rollup lists missed EXAM CODES, which reads
  # to a keyword rule (and to the LLM classifier, observed on
  # ALLCAMPUS_AKTR_MissedCodes_Q12026.xlsx) as answer-key material. That
  # misclassification put it in a restricted doc-type family, so it could never
  # reach a CDD or Blueprint. Matching it deterministically here settles the type
  # before the LLM is consulted.
  - doc_type: knowledge_test_report
    filename_keywords:
    - aktr
    - missedcodes
    - missed codes
    # No bare "knowledge test" here: it scores 8 on a filename, enough to tie
    # quiz_exam on a file called "Knowledge Test Prep.pdf" and then win on the lower
    # priority number. The text keywords below carry the real evidence.
    text_keywords:
    - most missed acs codes
    - '% missed'
    - airman knowledge test
    priority: 10
  - doc_type: quiz_answer_key
    filename_keywords:
    - answer key
    - exam key
    - quiz key
    - key
    text_keywords:
    - answer key
    - correct answer
    - rationale
    priority: 25
  - doc_type: quiz_exam
    filename_keywords:
    - quiz
    - exam
    - final exam
    - test
    text_keywords:
    - multiple choice
    - instructions
    - __/1 pt
    - student name date score
    priority: 30
  - doc_type: project_key
    filename_keywords:
    - project
    - key
    - instructor guide
    text_keywords:
    - key/instructor guide
    - answer key
    - instructor notes
    - grading
    priority: 35
  - doc_type: project_activity
    filename_keywords:
    - project
    - activity
    - lab
    text_keywords:
    - procedures
    - task 1
    - learning outcomes
    - equipment and tools
    - supplies and materials
    priority: 40
  - doc_type: study_questions
    filename_keywords:
    - study questions
    - review questions
    text_keywords:
    - study questions
    - self-study tool
    - review questions
    priority: 50
  - doc_type: lesson_slide_deck
    filename_keywords:
    - day
    - lecture
    - slides
    - presentation
    text_keywords:
    - daily maintenance plan
    - today’s focus
    - today's focus
    - debrief and q&a
    - quiz
    priority: 60
  - doc_type: ebook_reference
    filename_keywords:
    - ebook
    - handbook
    - far-amt
    - faa
    text_keywords:
    - federal aviation regulations
    - handbook
    - chapter
    - contents
    priority: 70
  structure_patterns:
    day_regex: \b(?:B\d+D(\d+)|Day\s*(\d+)|D(\d+))\b
    block_regex: \b(?:Block|BLK)\s*0*(\d+)\b
    week_regex: \bWeek\s*(\d+)\b
    table_schedule_keywords:
    - day
    - lesson
    - topic
    - project
    - quiz
    - exam
    - assignment
    - reading
    - acs code
    activity_keywords:
    - project
    - activity
    - lab
    - hangar
    - assignment
    assignment_keywords:
    - assignment
    - reading
    - prepare
    - homework
    - worksheet
    assessment_keywords:
    - quiz
    - exam
    - final
    - assessment
    - test
  unit_type_map:
    course_calendar: calendar_day
    syllabus: syllabus_section
    lesson_slide_deck: slide
    project_activity: project_task
    project_key: answer_key_item
    quiz_exam: quiz_question
    quiz_answer_key: answer_key_item
    study_questions: study_question
    ebook_reference: page
    instructor_guide: guide_section
    student_handout: chunk
    knowledge_test_report: knowledge_test_item
    other: chunk
    lesson_pdf: page
    slide_deck: slide
    quiz: quiz_question
    final_exam: quiz_question
    project: project_task
    hangar_activity: activity
    study_questions: study_question
    quiz_answer_key: answer_key_item
    final_exam_answer_key: answer_key_item
    project_instructor_guide: guide_section
  fallback_doc_type: other
  restricted_document_types:
  - quiz_answer_key
  - project_key
# Ingestion writes each content unit to BOTH stores below. They are complementary,
# not redundant: the vector store serves semantic/tag search, and the structure
# store is the relational system-of-record for exact filters, joins and reporting.
# Scope note (2026-07): both are populated at ingestion, but the live read path
# (services/context_retrieval.py) still reads S3 source JSON and queries NEITHER
# store yet. They are filled ahead of the retrieval wiring. If AIM only ever needs
# semantic tagging/search, structure_store can be disabled to avoid dual-write drift.
structure_store:
  enabled: true          # RDS (Postgres): relational system-of-record; exact/ACS/day joins, reporting
  provider: postgres
  url: 'postgresql://dis_user:Academian%23123@dis-dev-postgres.co7gbazco3kw.us-east-1.rds.amazonaws.com:5432/dis_db_dev'
  schema_name: dis
  auto_create_schema: true
vector_store:
  enabled: true          # OpenSearch: semantic kNN + tag filtering; used to map content to calendar days
  provider: opensearch
  endpoint: 'https://search-ai-platform-opensearch-6fjt7fienyf2aeactjfqdms4y4.us-east-1.es.amazonaws.com'
  index_name: dis-content-devlopment-aim
  region: us-east-1
  auth_mode: basic
  username: 'developer'
  password: 'Academian@2026'
  api_key_secret: ''
  auto_create_index: true

# AIM-specific content ingestion rules.
# Content/design team decisions should be changed here only; no Python code change needed.
aim_content_rules:
  default_program_id: aim
  default_course_id: general_science_i
  block_day_pattern: 'B(?P<block_number>\d+)D(?P<day_number>\d+)'

  # Calendar is source of truth for quiz, project, hangar, and study-question mapping.
  # Filename day is only a suggestion for these content types.
  calendar_mapping_strategy: calendar_first_then_filename
  calendar_mapping_required_types:
    - quiz
    - final_exam
    - project
    - hangar_activity
    - study_questions

  blueprint_source_types:
    - course_calendar
    - syllabus
    # Knowledge-test performance data is block-wide Blueprint input: it is what makes
    # "Targets for Quick Check" a measured figure instead of a placeholder.
    - knowledge_test_report

  course_generation_source_types:
    - lesson_pdf
    - slide_deck
    - quiz
    - final_exam
    - project
    - hangar_activity
    - study_questions

  # Change these after content team confirmation.
  # First matching folder gets source_priority=1.
  version_priority:
    lesson_pdf:
      - Finalized PDFs
      - Final PDFs
    slide_deck:
      - Final Slide Deck
    quiz:
      - Quizzes/5-PDFs/Updated PDFs
      - Quizzes/4-Finalized/Updated Quizzes
    quiz_answer_key:
      - Quizzes/5-PDFs/Updated PDFs
      - Quizzes/4-Finalized/Updated Quizzes
    final_exam:
      - Quizzes/5-PDFs
      - Quizzes/4-Finalized
    final_exam_answer_key:
      - Quizzes/5-PDFs
      - Quizzes/4-Finalized
    project:
      - Projects/4-PDF
      - Projects/3-Final
    project_instructor_guide:
      - Projects/4-PDF
      - Projects/3-Final
    hangar_activity:
      - Hangar Activities
    study_questions:
      - Study Questions
    course_calendar:
      - Teaching Outline & Syllabus
    syllabus:
      - Teaching Outline & Syllabus

  # Stored in raw/processed for traceability but excluded from blueprint/course-generation by default.
  exclude_path_contains:
    - Archive
    - Archived
    - 1-Original
    - 2-Edited
    - Retake

  # Always protected from student-facing context retrieval.
  restricted_filename_contains:
    - Answer Key
    - Instructor Guide
    - Exam Key
    - Quiz Key

  visibility_by_content_type:
    lesson_pdf: student
    slide_deck: student
    quiz: student
    final_exam: student
    project: student
    hangar_activity: student
    study_questions: student
    course_calendar: instructor_only
    syllabus: student
    quiz_answer_key: instructor_only
    final_exam_answer_key: instructor_only
    project_instructor_guide: instructor_only
    archive_or_working_version: internal_only

# Phase 7: AIM-only Topic Source Library filter. Do NOT copy into DEFAULT_REGISTRY
# or other tenants. cas_list intentionally omitted (DECISION-002).
metadata_framework:
  fields:
    topic:
      type: string
      tier: structural
      promote:
        - index
        - filter_options
        - retrieval
