client:
  client_id: aim
  client_name: Aviation Institute of Maintenance
  namespace: aim_ns
  enabled: true
  allowed_file_types:
  - pdf
  - docx
  - doc
  - pptx
  - xlsx
  - csv
  - txt
  - jpg
  - jpeg
  - png
  - zip
  max_file_size_mb: 250
  namespace_prefix: aim
  restricted_content: false
auth:
  client_admins:
  - user_id: admin1@aim.edu
    name: Client Admin One
    enabled: true
  - user_id: admin2@aim.edu
    name: Client Admin Two
    enabled: true
  users:
  - user_id: user1@aim.edu
    name: Content User One
    enabled: true
ingestion:
  max_concurrent_files: 10
  dedup_enabled: true
  quarantine_on_fail: true
  schema_validation: true
processing:
  mode: local_parallel
  max_workers: 5
  queue_enabled: false
  folder_scan_return_results_limit: 200
  fast_pptx_enabled: true
  max_pptx_slides: 200
  pptx_extract_images: true
  max_extracted_chars: 250000
pipeline:
  models:
    embedding: amazon.titan-embed-text-v2:0
    # Sonnet 4.5 on the `global.` inference profile — current, and the only viable
    # choice for us-east-1. Availability is per-region AND per-role; verified live by
    # direct InvokeModel with a developer's credentials:
    #
    #   global.anthropic.claude-sonnet-4-5-20250929-v1:0  us-east-1 OK   ap-south-1 OK
    #   anthropic.claude-3-sonnet-20240229-v1:0           ap-south-1 OK  us-east-1 EOL
    #   anthropic.claude-3-haiku-20240307-v1:0            legacy, denied in both
    #   *.anthropic.claude-haiku-4-5-20251001-v1:0        AccessDenied (no model access)
    #
    # A ROLE THAT LACKS BEDROCK MODEL ACCESS FOR THIS ID WILL STILL FAIL. On
    # 2026-08-12 a deployed role could not invoke it and, because call_llm returns a
    # VALID-JSON stub on any exception, the failure was silent: every MAP call got the
    # stub, 8 of 20 days came back with concept_type "Unknown", every AM.I.B ACS code
    # was orphaned, and the job reported success. The build now preflights this model
    # once and fails loudly with the AWS error instead (services/digests/build.py).
    #
    # To run a different model in one environment, set DIS_MODEL_TEXT_ALL there
    # rather than editing this file.
    classification: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    metadata_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    structure_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    quality_check: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    vision: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    # Per-day digest (MAP) for block-wide CDD/Blueprint. The design pins this to
    # Haiku for a tier-shared cache (D2); Haiku is unavailable on this account in
    # either region, so MAP runs on the shared text model.
    digest_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
  llm_temperature: 0.0
  chunking_strategy: semantic
  chunk_size: 512
  chunk_overlap: 64
  vision_enabled: true
  llm_provider: bedrock
  bedrock_enabled: true
  anthropic_enabled: false
metadata_schemas:
  aim:
    required_fields:
    - name: course_name
      type: string
      hint: Course name inferred from folder, file name, or source content
    - name: document_type
      type: enum
      values:
      - course_calendar
      - syllabus
      - lesson_slide_deck
      - project_activity
      - project_key
      - quiz_exam
      - quiz_answer_key
      - study_questions
      - ebook_reference
      - instructor_guide
      - student_handout
      - other
    - name: topic
      type: string
    - name: unit_type
      type: enum
      values:
      - calendar_day
      - syllabus_section
      - project_task
      - quiz_question
      - answer_key_item
      - slide
      - page
      - chunk
      - image
    optional_fields:
    - name: program
      type: string
    - name: block
      type: string
    - name: module_name
      type: string
    - name: lesson_name
      type: string
    - name: difficulty_level
      type: enum
      values:
      - introductory
      - intermediate
      - advanced
    - name: keywords
      type: list
    - name: visual_summary
      type: string
storage:
  provider: s3
  raw_bucket: content-ai-studio
  processed_bucket: content-ai-studio
  base_prefix: DIS
  vector_index: dis-content-dev
  retention_days: 365
  s3:
    region: us-east-1
    kms_key_id: ''
    endpoint_url: ''
  azure:
    account_name: ''
    account_key_secret: AZURE_STORAGE_KEY
    container_raw: dis-raw-aim
    container_processed: dis-processed-aim
  gcp:
    project_id: ''
    credentials_secret: GCP_SERVICE_ACCOUNT_JSON
    bucket_raw: dis-raw-aim
    bucket_processed: dis-processed-aim
  local:
    base_path: /unused/s3-only
retrieval:
  max_results: 20
  result_size_cap: 50
  restricted_content_filter: true

  purpose_labels:
    style: Style Reference Documents
    cdd: Course Design Sources
    blueprint: Calendar / Block Sources
    course_generation: Lesson Source Materials
  source_ui:
    common_filters:
      - purpose
      - document_type
      - visibility
      - status
      - search
    taxonomy_filters:
      - key: course_name
        label: Course
        type: select
      - key: block
        label: Block
        type: select
      - key: day
        label: Day
        type: select
      - key: topic
        label: Topic
        type: text
  source_type_mapping:
    style:
      - style_guide
      - authoring_guide
      - authoring_guidelines
      - sample_lesson
      - approved_template
    cdd:
      - syllabus
      - course_outline
      - course_calendar
      - program_overview
      - learning_objectives
    blueprint:
      - course_calendar
      - block_schedule
      - syllabus
      - lesson_plan
    course_generation:
      # Pipeline-era classification names (kept for backward compatibility).
      - lesson_plan
      - lesson_slide_deck
      - project_activity
      - quiz_exam
      - student_handout
      - ebook_reference
      # Actual Source Library doc types produced for AIM (must be listed here or
      # course-generation retrieval finds nothing). Mirrors
      # aim_content_rules.course_generation_source_types below.
      - lesson_pdf
      - slide_deck
      - quiz
      - final_exam
      - project
      - hangar_activity
      - study_questions
security:
  require_jwt: true
  jwt_audience: aim-dis-api
monitoring:
  slo_ingestion_p95_ms: 10000
  slo_retrieval_p95_ms: 500
embedding:
  enabled: true
  provider: bedrock
  model_id: amazon.titan-embed-text-v2:0
  dimension: 1024
  region: us-east-1
  max_input_chars: 50000
document_processing:
  profile: aviation_academic
  enabled_document_types:
  - course_calendar
  - syllabus
  - lesson_slide_deck
  - project_activity
  - project_key
  - quiz_exam
  - quiz_answer_key
  - study_questions
  - ebook_reference
