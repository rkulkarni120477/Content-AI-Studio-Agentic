  pptx_extract_images: true
  max_extracted_chars: 250000
pipeline:
  models:
    embedding: amazon.titan-embed-text-v2:0
    # Sonnet 4.5 on the `global.` inference profile.
    #
    # CORRECTED 2026-08-14. An earlier note here recorded sonnet-5, opus-5,
    # sonnet-4-6, opus-4-8 and haiku-4-5 as "0/3 — cannot invoke" and concluded this
    # account could reliably run only Sonnet 4.5. That was a PARSE BUG in the probe,
    # not an access problem: it read the answer from `content[0]["text"]`, and a
    # reasoning model puts a `thinking` block at index 0. The "single spurious
    # success before failing every repeat" that the old note found so suspicious was
    # the tell — the same model emits a thinking block only sometimes, so the probe
    # passed exactly when it happened not to. Re-measured with correct parsing,
    # 3 consecutive InvokeModel calls per ID from ap-south-1:
    #
    #   global.anthropic.claude-sonnet-4-5-20250929-v1:0  3/3
    #   global.anthropic.claude-sonnet-5                  3/3
    #   global.anthropic.claude-opus-5                    3/3  (thinking block on 2 of 3)
    #   global.anthropic.claude-sonnet-4-6                3/3
    #   global.anthropic.claude-opus-4-8                  3/3
    #   global.anthropic.claude-haiku-4-5-20251001-v1:0   3/3
    #   global.anthropic.claude-fable-5                   0/3  ValidationException (real)
    #   anthropic.claude-3-sonnet-20240229-v1:0           ap-south-1 OK, us-east-1 EOL
    #
    # The pins below stay on Sonnet 4.5 pending a deliberate model change, not
    # because the others are unavailable. Moving MAP to Haiku is now actually open
    # (see digest_extraction) — it was ruled out on this bad measurement.
    #
    # Lesson worth keeping: measure repeatedly AND check what a failure actually was.
    # "0/3" here never distinguished a refused call from a misread one.
    #
    # A ROLE THAT LACKS BEDROCK MODEL ACCESS FOR THIS ID WILL STILL FAIL. On
    # 2026-08-12 a deployed role could not invoke it and, because call_llm returns a
    # VALID-JSON stub on any exception, the failure was silent: every MAP call got the
    # stub, 8 of 20 days came back with concept_type "Unknown", every AM.I.B ACS code
    # was orphaned, and the job reported success. The build now preflights this model
    # once and fails loudly with the AWS error instead (services/digests/build.py).
    #
    # To run a different model in one environment, set DIS_MODEL_TEXT_ALL there
    # rather than editing this file.
    classification: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    metadata_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    structure_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    quality_check: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    vision: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    # Per-day digest (MAP) for block-wide CDD/Blueprint. The design pins this to
    # Haiku for a tier-shared cache (D2). Left on the shared text model because
    # Haiku measured AccessDenied — a reading now known to be wrong (see above:
    # haiku-4-5 is 3/3). Switching is a real option and a real cost saving, but it
    # changes the digest cache key and rebuilds every day of every block, so it
    # wants to be a deliberate change with a rebuild window, not a drive-by edit.
    digest_extraction: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    # Per-page ebook_reference content tags (topics / ACS / summary). Shared
    # Sonnet pin so quality matches the rest of ingest; switch to Haiku in YAML
    # when cost matters more than tag richness.
    ebook_page_tagging: global.anthropic.claude-sonnet-4-5-20250929-v1:0
  # Digest MAP fan-out (plan D4). Sequential MAP is O(days) and Block 2 has 20, which
  # does not fit the product: a cold build measured ~6.5 min locally and EXCEEDED the
  # 1200s ceiling on build_digests_sync in prod on 2026-08-13 (~22 min), failing the
  # whole generation with "DIS unavailable: timed out" after every day's work was
  # already paid for. Wall clock is also the user-facing problem in its own right —
  # nobody can sit on a page for twenty minutes.
  #
  # Enabled for AIM specifically rather than flipping the global default: this is the
  # tenant with 20-day blocks and the one whose timings are measured. Concurrency 5 is
  # the shipped default and puts a 20-day build at roughly four sequential rounds.
  #
  # Safe to raise the concurrency only after watching for ThrottlingException in the
  # '[LLM] failed' lines — five concurrent InvokeModel calls is the point where a
  # per-account Bedrock quota starts to bite, and retries are already adaptive
  # (services/pipeline/common.py:bedrock_invoke_config).
  digest_fanout_enabled: true
  digest_fanout_max_concurrency: 5
  llm_temperature: 0.0
  chunking_strategy: semantic
  chunk_size: 512
  chunk_overlap: 64
  vision_enabled: true
  llm_provider: bedrock
  bedrock_enabled: true
  anthropic_enabled: false
  # Batched per-page LLM tags for ebook_reference units.
  ebook_page_tagging_enabled: true
  ebook_page_tagging_batch_size: 10
