    - exam
    - final
    - assessment
    - test
  unit_type_map:
    course_calendar: calendar_day
    syllabus: syllabus_section
    lesson_slide_deck: slide
    project_activity: project_task
    project_key: answer_key_item
    quiz_exam: quiz_question
    quiz_answer_key: answer_key_item
    study_questions: study_question
    ebook_reference: page
    instructor_guide: guide_section
    student_handout: chunk
    other: chunk
    lesson_pdf: page
    slide_deck: slide
    quiz: quiz_question
    final_exam: quiz_question
    project: project_task
    hangar_activity: activity
    study_questions: study_question
    quiz_answer_key: answer_key_item
    final_exam_answer_key: answer_key_item
    project_instructor_guide: guide_section
  fallback_doc_type: other
  restricted_document_types:
  - quiz_answer_key
  - project_key
# Ingestion writes each content unit to BOTH stores below. They are complementary,
# not redundant: the vector store serves semantic/tag search, and the structure
# store is the relational system-of-record for exact filters, joins and reporting.
# Scope note (2026-07): both are populated at ingestion, but the live read path
# (services/context_retrieval.py) still reads S3 source JSON and queries NEITHER
# store yet. They are filled ahead of the retrieval wiring. If AIM only ever needs
# semantic tagging/search, structure_store can be disabled to avoid dual-write drift.
structure_store:
  enabled: true          # RDS (Postgres): relational system-of-record; exact/ACS/day joins, reporting
  provider: postgres
  url: 'postgresql://dis_user:Academian%23123@dis-dev-postgres.co7gbazco3kw.us-east-1.rds.amazonaws.com:5432/dis_db'
  schema_name: dis
  auto_create_schema: true
vector_store:
  enabled: true          # OpenSearch: semantic kNN + tag filtering; used to map content to calendar days
  provider: opensearch
  endpoint: 'https://search-ai-platform-opensearch-6fjt7fienyf2aeactjfqdms4y4.us-east-1.es.amazonaws.com'
  index_name: dis-content-dev-aim
  region: us-east-1
  auth_mode: basic
  username: 'developer'
  password: 'Academian@2026'
  api_key_secret: ''
  auto_create_index: true

# AIM-specific content ingestion rules.
# Content/design team decisions should be changed here only; no Python code change needed.
aim_content_rules:
  default_program_id: aim
  default_course_id: general_science_i
  block_day_pattern: 'B(?P<block_number>\d+)D(?P<day_number>\d+)'

  # Calendar is source of truth for quiz, project, hangar, and study-question mapping.
  # Filename day is only a suggestion for these content types.
  calendar_mapping_strategy: calendar_first_then_filename
  calendar_mapping_required_types:
    - quiz
    - final_exam
    - project
    - hangar_activity
    - study_questions

  blueprint_source_types:
    - course_calendar
    - syllabus

  course_generation_source_types:
    - lesson_pdf
    - slide_deck
    - quiz
    - final_exam
    - project
    - hangar_activity
    - study_questions

  # Change these after content team confirmation.
  # First matching folder gets source_priority=1.
  version_priority:
    lesson_pdf:
      - Finalized PDFs
      - Final PDFs
    slide_deck:
      - Final Slide Deck
    quiz:
      - Quizzes/5-PDFs/Updated PDFs
      - Quizzes/4-Finalized/Updated Quizzes
    quiz_answer_key:
      - Quizzes/5-PDFs/Updated PDFs
      - Quizzes/4-Finalized/Updated Quizzes
    final_exam:
      - Quizzes/5-PDFs
      - Quizzes/4-Finalized
    final_exam_answer_key:
      - Quizzes/5-PDFs
      - Quizzes/4-Finalized
    project:
      - Projects/4-PDF
      - Projects/3-Final
    project_instructor_guide:
      - Projects/4-PDF
      - Projects/3-Final
    hangar_activity:
      - Hangar Activities
    study_questions:
      - Study Questions
    course_calendar:
      - Teaching Outline & Syllabus
    syllabus:
      - Teaching Outline & Syllabus

  # Stored in raw/processed for traceability but excluded from blueprint/course-generation by default.
  exclude_path_contains:
    - Archive
    - Archived
    - 1-Original
    - 2-Edited
    - Retake

  # Always protected from student-facing context retrieval.
  restricted_filename_contains:
    - Answer Key
    - Instructor Guide
    - Exam Key
    - Quiz Key

  visibility_by_content_type:
    lesson_pdf: student
    slide_deck: student
    quiz: student
    final_exam: student
    project: student
    hangar_activity: student
    study_questions: student
    course_calendar: instructor_only
    syllabus: student
    quiz_answer_key: instructor_only
    final_exam_answer_key: instructor_only
    project_instructor_guide: instructor_only
    archive_or_working_version: internal_only
