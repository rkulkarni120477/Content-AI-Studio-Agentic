client:
  client_id: academian
  client_name: Academian Content Studio
  namespace: academian_ns
  enabled: true
  allowed_file_types:
  - pdf
  - docx
  - doc
  - pptx
  - xlsx
  - csv
  - txt
  - jpg
  - jpeg
  - png
  - zip
  max_file_size_mb: 250
  namespace_prefix: academian
  restricted_content: false
auth:
  client_admins:
  - user_id: admin1@academian.com
    name: Academian Client Admin One
    enabled: true
  - user_id: admin2@academian.com
    name: Academian Client Admin Two
    enabled: true
  users:
  - user_id: user1@academian.com
    name: Academian Content User One
    enabled: true
ingestion:
  max_concurrent_files: 10
  dedup_enabled: true
  quarantine_on_fail: true
  schema_validation: true
processing:
  mode: local_parallel
  max_workers: 5
  queue_enabled: false
  folder_scan_return_results_limit: 200
  fast_pptx_enabled: true
  max_pptx_slides: 80
  pptx_extract_images: false
  max_extracted_chars: 250000
pipeline:
  models:
    embedding: amazon.titan-embed-text-v2:0
    classification: anthropic.claude-3-haiku-20240307-v1:0
    metadata_extraction: anthropic.claude-3-sonnet-20240229-v1:0
    structure_extraction: anthropic.claude-3-sonnet-20240229-v1:0
    quality_check: anthropic.claude-3-haiku-20240307-v1:0
    vision: anthropic.claude-3-sonnet-20240229-v1:0
  llm_temperature: 0.0
  chunking_strategy: semantic
  chunk_size: 512
  chunk_overlap: 64
  vision_enabled: false
  llm_provider: mock
  bedrock_enabled: false
  anthropic_enabled: false
metadata_schemas:
  academian:
    required_fields:
    - name: course_name
      type: string
      hint: Course name inferred from folder, file name, or source content
    - name: document_type
      type: enum
      values:
      - course_calendar
      - syllabus
      - lesson_slide_deck
      - project_activity
      - project_key
      - quiz_exam
      - quiz_answer_key
      - study_questions
      - ebook_reference
      - instructor_guide
      - student_handout
      - other
    - name: topic
      type: string
    - name: unit_type
      type: enum
      values:
      - calendar_day
      - syllabus_section
      - project_task
      - quiz_question
      - answer_key_item
      - slide
      - page
      - chunk
      - image
    optional_fields:
    - name: program
      type: string
    - name: block
      type: string
    - name: module_name
      type: string
    - name: lesson_name
      type: string
    - name: difficulty_level
      type: enum
      values:
      - introductory
      - intermediate
      - advanced
    - name: keywords
      type: list
    - name: visual_summary
      type: string
storage:
  provider: s3
  raw_bucket: content-ai-studio
  processed_bucket: content-ai-studio
  base_prefix: DIS
  vector_index: dis-content-dev
  retention_days: 365
  s3:
    region: us-east-1
    kms_key_id: ''
    endpoint_url: ''
  azure:
    account_name: ''
    account_key_secret: AZURE_STORAGE_KEY
    container_raw: dis-raw-aim
    container_processed: dis-processed-aim
  gcp:
    project_id: ''
    credentials_secret: GCP_SERVICE_ACCOUNT_JSON
    bucket_raw: dis-raw-aim
    bucket_processed: dis-processed-aim
  local:
    base_path: /unused/s3-only
retrieval:
  max_results: 20
  result_size_cap: 50
  restricted_content_filter: true
security:
  require_jwt: true
  jwt_audience: aim-dis-api
monitoring:
  slo_ingestion_p95_ms: 10000
  slo_retrieval_p95_ms: 500
embedding:
  enabled: false
  provider: bedrock
  model_id: amazon.titan-embed-text-v2:0
  dimension: 1024
  region: us-east-1
  # Titan v2's hard limit is 8,192 TOKENS. 50000 chars is roughly 12,500 tokens, so
  # a long unit was rejected with "Too many input tokens" — and because a failed
  # embedding fell through to indexing the unit with an empty vector, the document
  # landed in the index unfindable by semantic search, with the job reporting
  # success. 24000 keeps the worst realistic ratio (~3 chars/token) under the limit.
  # Clipping is logged; see generate_embeddings.
  max_input_chars: 24000
document_processing:
  profile: generic_academic
  enabled_document_types:
  - course_calendar
  - syllabus
  - lesson_slide_deck
  - project_activity
  - project_key
  - quiz_exam
  - quiz_answer_key
  - study_questions
  - ebook_reference
  - instructor_guide
  - student_handout
  - other
  document_type_rules:
  - doc_type: syllabus
    filename_keywords:
    - syllabus
    - course outline
    text_keywords:
    - course description
    - learning outcomes
    - grading
    - attendance
    priority: 10
  - doc_type: course_calendar
    filename_keywords:
    - calendar
    - schedule
    - course plan
    text_keywords:
    - week 1
    - day 1
    - session 1
    - module 1
    - topic
    - assignment
    priority: 20
  - doc_type: project_activity
    filename_keywords:
    - project
    - assignment
    - activity
    - lab
    text_keywords:
    - instructions
    - procedure
    - rubric
    - deliverable
    priority: 30
  - doc_type: quiz_answer_key
    filename_keywords:
    - answer key
    - key
    text_keywords:
    - answer key
    - correct answer
    priority: 35
  - doc_type: quiz_exam
    filename_keywords:
    - quiz
    - exam
    - test
    - assessment
    text_keywords:
    - multiple choice
    - questions
    - score
    priority: 40
  - doc_type: lesson_slide_deck
    filename_keywords:
    - slides
    - presentation
    - deck
    text_keywords:
    - agenda
    - learning objectives
    - discussion
    priority: 50
  - doc_type: study_questions
    filename_keywords:
    - study questions
    - review questions
    text_keywords:
    - study questions
    - review questions
    priority: 60
  - doc_type: ebook_reference
    filename_keywords:
    - ebook
    - book
    - handbook
    - manual
    text_keywords:
    - contents
    - chapter
    - index
    priority: 70
  structure_patterns:
    day_regex: \b(?:Day\s*(\d+)|Session\s*(\d+)|Module\s*(\d+)|Week\s*(\d+))\b
    block_regex: \b(?:Block|BLK|Module)\s*0*(\d+)\b
    week_regex: \bWeek\s*(\d+)\b
    table_schedule_keywords:
    - day
    - week
    - session
    - module
    - lesson
    - topic
    - assignment
    - assessment
    activity_keywords:
    - project
    - activity
    - lab
    - exercise
    - assignment
    assignment_keywords:
    - assignment
    - reading
    - homework
    - worksheet
    - deliverable
    assessment_keywords:
    - quiz
    - exam
    - assessment
    - test
    - rubric
  unit_type_map:
    course_calendar: calendar_day
    syllabus: syllabus_section
    lesson_slide_deck: slide
    project_activity: project_task
    project_key: answer_key_item
    quiz_exam: quiz_question
    quiz_answer_key: answer_key_item
    study_questions: study_question
    ebook_reference: page
    instructor_guide: guide_section
    student_handout: chunk
    other: chunk
  fallback_doc_type: other
  restricted_document_types:
  - quiz_answer_key
  - project_key
structure_store:
  enabled: false
  provider: postgres
  url: ''
  schema_name: dis
  auto_create_schema: true
vector_store:
  enabled: false
  provider: opensearch
  endpoint: ''
  index_name: dis-content-dev
  region: us-east-1
  auth_mode: aws_iam
  username: ''
  password: ''
  api_key_secret: ''
  auto_create_index: true
