# =============================================================================
# Content AI Studio — Docker Compose
#
# Services:
#   api           FastAPI backend (port 8000)
#   celery-worker Background job processor (no exposed port)
#   redis         Celery broker + result backend (port 6379)
#   postgres      Local dev database (port 5432) — prod uses AWS RDS
#   phoenix       Self-hosted LLM tracing UI (port 6006) — traces live in a
#                 dedicated database on the same RDS instance, see below
#
# Usage:
#   Start all:         docker-compose up -d --build
#   View API logs:     docker-compose logs -f api
#   View worker logs:  docker-compose logs -f celery-worker
#   Stop all:          docker-compose down
# =============================================================================

services:

  api:
    build:
      context: .
      target: development

    container_name: ${MAIN_API_CONTAINER_NAME}

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    env_file:
      - .env

    ports:
      - "${MAIN_API_PORT}:8000"

    volumes:
      - .:/app

    # host.docker.internal resolves automatically on Docker Desktop (local dev)
    # but not on plain Docker Engine on Linux (prod EC2) — needed for
    # DIS_API_BASE_URL, which points at host.docker.internal to reach that
    # sibling service via its host-mapped port.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      redis:
        condition: service_healthy

    # Hard memory ceiling (P6.3, F13) — caps a runaway container; normal usage
    # stays far below. Sized for the ~7.6 GB Docker budget on this host.
    mem_limit: 1.5g

    restart: unless-stopped


  redis:
    image: redis:7-alpine
 
    container_name: ${REDIS_CONTAINER_NAME}
 
    restart: unless-stopped
 
    ports:
      - "${REDIS_PORT}:6379"
 
    volumes:
      - ${REDIS_VOLUME}:/data

    # Hard memory ceiling (P6.3, F13) — broker + result backend stay small.
    mem_limit: 512m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
 
 
  celery_worker:
    build: .

    container_name: ${CELERY_CONTAINER_NAME}

    command: celery -A promptops_app.celery_app worker --loglevel=info --concurrency=2

    env_file:
      - .env

    # Without this, budget_service._live_flag()'s dotenv_values(".env") reads
    # the .env baked into the image at build time, not the live host file —
    # api's own bind mount below is what makes BUDGET_ENFORCEMENT_MODE/
    # BUDGET_ENFORCEMENT_KILLSWITCH flip with no restart there; this worker
    # runs block-wide generation's most expensive calls, so it needs the same
    # live read, not a stale one that only updates on a full rebuild.
    volumes:
      - .:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      redis:
        condition: service_healthy

    # Hard memory ceiling (P6.3, F13) — the heavy service (parse + LLM +
    # embedding). With --concurrency=2 it holds up to 2 tasks at once (~1 GB
    # headroom each). Pairs with worker_max_*_per_child recycling in celery_app.py.
    mem_limit: 2g

    restart: unless-stopped


  api_server:
    build: .

    container_name: ${API_CONTAINER_NAME}

    command: uvicorn api_server:app --host 0.0.0.0 --port 8502

    env_file:
      - .env

    ports:
      - "${API_PORT}:8502"

    depends_on:
      redis:
        condition: service_healthy

    # Hard memory ceiling (P6.3, F13) — secondary API.
    mem_limit: 512m

    restart: unless-stopped

  dis_backend:
    build:
      context: ./dis_backend

    container_name: ${DIS_CONTAINER_NAME}

    command: uvicorn main:app --host 0.0.0.0 --port 8000

    env_file:
      - ./dis_backend/.env

    ports:
      - "${DIS_PORT}:8000"

    # Hard memory ceiling (P6.3, F13) — parsing / indexing service.
    mem_limit: 2g

    restart: unless-stopped


  phoenix:
    image: arizephoenix/phoenix:latest

    container_name: ${PHOENIX_CONTAINER_NAME}

    env_file:
      - .env

    # Bound to localhost only — reach the UI via an SSH tunnel:
    # ssh -L 6006:localhost:6006 <user>@<host>
    # The api/celery containers reach it over the compose network by service
    # name (http://phoenix:6006), no host.docker.internal needed.
    ports:
      - "127.0.0.1:6006:6006"

    # Hard memory ceiling — one lightweight container. No ClickHouse/Redis/
    # MinIO/separate worker here; traces are stored in a dedicated "phoenix"
    # database on the same RDS instance CAS's own app already uses — see
    # PHOENIX_SETUP.md for the one-time setup.
    mem_limit: 768m

    restart: unless-stopped


volumes:
  redis_local_data:
  redis_data:
  redis_dev_data:
