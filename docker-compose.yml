services:

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - ${REDIS_VOLUME}:/data


  promptops:
    build: .

    container_name: ${APP_CONTAINER_NAME}

    ports:
      - "${APP_PORT}:8501"

    env_file:
      - .env

    restart: unless-stopped


  celery_worker:
    build: .

    container_name: ${CELERY_CONTAINER_NAME}

    command: celery -A promptops_app.celery_app worker --loglevel=info --concurrency=2

    env_file:
      - .env

    restart: unless-stopped


volumes:
  redis_data:
  redis_dev_data:
