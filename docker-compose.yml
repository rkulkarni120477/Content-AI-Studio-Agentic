services:
  redis:
    image: redis:7-alpine
    container_name: contentai_dev_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  promptops:
    build: .
    container_name: promptops_dev_app
    ports:
      - "5001:8501"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
