name: Deploy Content AI Backend

on:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "api_server.py"
      - "promptops_app/**"
      - "dis_backend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===================================="
            echo "Starting Backend Deployment"
            echo "===================================="

            cd /opt/content-ai

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to dev branch..."
            git checkout dev

            echo "Syncing with remote..."
            git reset --hard origin/dev

            echo "Building and starting all backend services..."
            docker compose up -d --build --remove-orphans

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Waiting for services to start..."
            sleep 20

            echo "Checking CAS Backend..."
            curl -f https://cas-api.academian.com/docs >/dev/null

            echo "Checking DIS Backend..."
            curl -f http://localhost:8010/docs >/dev/null

            echo "Running containers..."
            docker compose ps

            echo "===================================="
            echo "Backend Deployment Successful"
            echo "===================================="