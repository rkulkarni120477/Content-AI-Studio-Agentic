name: Deploy Content AI Backend

on:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "api_server.py"
      - "promptops_app/**"
      - "dis_backend/**"
      - "langfuse/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===================================="
            echo "Starting Backend Deployment"
            echo "===================================="

            cd /opt/content-ai

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to dev branch..."
            git checkout dev

            echo "Syncing with remote..."
            git reset --hard origin/dev

            echo "Building and starting all backend services..."
            docker compose up -d --build --remove-orphans

            echo "Starting Langfuse observability stack (self-hosted, P1)..."
            # A separate compose project (see langfuse/docker-compose.yml's own
            # header) — langfuse/.env holds real secrets and is gitignored, so
            # it must already exist on this host (one-time manual setup, see
            # LANGFUSE_SETUP.md). Skip rather than fail the whole deploy if a
            # host hasn't been provisioned with it yet — Langfuse is
            # best-effort observability, not a dependency the API needs to boot.
            if [ -f langfuse/.env ]; then
              (cd langfuse && docker compose up -d --build --remove-orphans)
            else
              echo "langfuse/.env not found — skipping Langfuse startup."
            fi

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Waiting for CAS Backend..."
            until curl -fs https://cas-api.academian.com/docs >/dev/null; do
              echo "Waiting for CAS..."
              sleep 5
            done

            echo "Waiting for DIS Backend..."
            until curl -fs http://localhost:8010/docs >/dev/null; do
              echo "Waiting for DIS..."
              sleep 5
            done

            echo "Running containers..."
            docker compose ps

            echo "===================================="
            echo "Backend Deployment Successful"
            echo "===================================="