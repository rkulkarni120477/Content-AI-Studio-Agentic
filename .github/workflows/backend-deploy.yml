name: Deploy Content AI Backend

on:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - "api_server.py"
      - "promptops_app/**"
      - "dis_backend/**"
      - "langfuse/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===================================="
            echo "Starting Backend Deployment"
            echo "===================================="

            cd /opt/content-ai

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to dev branch..."
            git checkout dev

            echo "Syncing with remote..."
            git reset --hard origin/dev

            echo "Building and starting all backend services..."
            docker compose up -d --build --remove-orphans

            echo "Starting Langfuse observability stack (self-hosted, P1)..."
            # A separate compose project (see langfuse/docker-compose.yml's own
            # header) reading its variables from this same root .env — real
            # secrets, gitignored, must already be in it (one-time manual
            # setup, see LANGFUSE_SETUP.md). Skip rather than fail the whole
            # deploy if a host hasn't been provisioned with them yet —
            # Langfuse is best-effort observability, not a dependency the API
            # needs to boot.
            if grep -q "^LANGFUSE_INIT_ORG_ID=" .env 2>/dev/null; then
              docker compose -f langfuse/docker-compose.yml --env-file .env up -d --build --remove-orphans
            else
              echo "Langfuse variables not found in .env — skipping Langfuse startup."
            fi

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Waiting for CAS Backend..."
            until curl -fs https://cas-api.academian.com/docs >/dev/null; do
              echo "Waiting for CAS..."
              sleep 5
            done

            echo "Waiting for DIS Backend..."
            until curl -fs http://localhost:8010/docs >/dev/null; do
              echo "Waiting for DIS..."
              sleep 5
            done

            echo "Running containers..."
            docker compose ps

            echo "===================================="
            echo "Backend Deployment Successful"
            echo "===================================="