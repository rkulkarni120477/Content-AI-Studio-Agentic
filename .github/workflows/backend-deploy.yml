name: Deploy Content AI Backend

on:
  push:
    branches:
      - prod
    paths:
      - "app/**"
      - "api_server.py"
      - "promptops_app/**"
      - "dis_backend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/backend-deploy.yml"
      # This job now runs `alembic upgrade head`, so a migration-only change
      # is a deployable change — without these two, adding a migration
      # silently never reaches the host and the schema drifts behind the code
      # that expects it.
      - "migrations/**"
      - "alembic.ini"

  # Lets a deploy be re-run by hand after a failure that needed an out-of-band
  # fix on the host (e.g. stamping alembic_version), without an empty commit.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Notify Deployment Started
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "🚀 CAS PROD Backend Deployment Started",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: develop\nRepository: ${{ github.repository }}\nCommit: ${{ github.sha }}",
                      "wrap": true
                    }
                  ]
                }
              }]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
          

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===================================="
            echo "Starting Backend Deployment"
            echo "===================================="

            cd /opt/content-ai

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to dev branch..."
            git checkout prod

            echo "Syncing with remote..."
            git reset --hard origin/prod

            echo "Building and starting all backend services..."
            docker compose up -d --build --remove-orphans

            echo "Applying database migrations..."
            # Nothing else in this deploy path runs Alembic — Dockerfile CMD is
            # just uvicorn, and init_db() only handles the legacy DB_AUTO_DDL
            # escape hatch, not real migrations. Earlier migrations were all
            # additive/nullable so a missed one was harmless; a rename (like
            # llm_usage_logs.langfuse_trace_id -> trace_id) is not — every LLM
            # call's usage/cost row silently stops being written until this runs.
            docker compose exec -T api alembic upgrade head

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Waiting for CAS Backend..."
            until curl -fs https://cas-api.academian.com/docs >/dev/null; do
              echo "Waiting for CAS..."
              sleep 5
            done

            echo "Waiting for DIS Backend..."
            until curl -fs http://localhost:8010/docs >/dev/null; do
              echo "Waiting for DIS..."
              sleep 5
            done

            echo "Running containers..."
            docker compose ps

            echo "===================================="
            echo "Backend Deployment Successful"
            echo "===================================="

      - name: Notify Deployment Success
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "✅ CAS PROD Backend Deployment Successful",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: develop\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}",
                      "wrap": true
                    }
                  ]
                }
              }]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"


      - name: Notify Deployment Failure
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "❌ CAS PROD Backend Deployment Failed",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Branch: develop\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}",
                      "wrap": true
                    }
                  ]
                }
              }]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"