# =============================================================================
# FastAPI Deployment — dev branch → EC2 via SSM
#
# This pipeline replaces dev-contentai-deploy.yml once the FastAPI backend
# is confirmed production-ready and Streamlit has been decommissioned.
#
# Key differences from the Streamlit pipeline:
#   - Runs the test suite before deploying (gate)
#   - Runs `alembic upgrade head` before starting containers
#   - Starts 3 services: api, celery-worker, redis
#   - Health-checks /api/v1/health instead of the Streamlit port
#   - Container log tail uses `contentai_api` not `promptops_app`
# =============================================================================

name: Deploy FastAPI to EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run tests — deployment is blocked if any test fails
  # ---------------------------------------------------------------------------
  test:
    name: Run test suite (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt httpx pytest pytest-asyncio
      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-gate-secret-not-for-production
          DATABASE_URL: sqlite:///:memory:
          APP_ENV: development
        run: pytest tests/ -q --tb=short

  # ---------------------------------------------------------------------------
  # Job 2: Deploy (only runs if test job passes)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application
        run: |
          zip -r contentai-api-${{ github.sha }}.zip . \
            -x ".git/*" ".github/*" ".env" "*.pem" "__pycache__/*" "*.pyc" \
            -x "*.egg-info/*" ".pytest_cache/*" "htmlcov/*" ".coverage"

      - name: Upload artifact to S3
        run: |
          aws s3 cp contentai-api-${{ github.sha }}.zip \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/contentai-api-${{ github.sha }}.zip

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "export HOME=/root",
              "echo === Downloading deployment artifact ===",
              "mkdir -p /tmp/contentai-deploy",
              "aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/contentai-api-${{ github.sha }}.zip /tmp/contentai-deploy/app.zip",
              "echo === Backing up .env ===",
              "cp /opt/contentai/.env /tmp/contentai.env.backup || true",
              "echo === Replacing application code ===",
              "rm -rf /opt/contentai-new",
              "mkdir -p /opt/contentai-new",
              "unzip -o /tmp/contentai-deploy/app.zip -d /opt/contentai-new",
              "cp /tmp/contentai.env.backup /opt/contentai-new/.env || true",
              "rm -rf /opt/contentai-backup",
              "mv /opt/contentai /opt/contentai-backup || true",
              "mv /opt/contentai-new /opt/contentai",
              "cd /opt/contentai",
              "echo === Stopping existing containers ===",
              "docker-compose down --remove-orphans || true",
              "echo === Building new image ===",
              "docker-compose build --no-cache api celery-worker",
              "echo === Running database migrations ===",
              "docker-compose run --rm api alembic upgrade head",
              "echo === Starting all services ===",
              "docker-compose up -d",
              "echo === Waiting for API to be healthy ===",
              "sleep 10",
              "for i in $(seq 1 12); do curl -sf http://localhost:8000/api/v1/health && break || sleep 5; done",
              "echo === Container status ===",
              "docker ps",
              "echo === API logs (last 50 lines) ===",
              "docker logs --tail 50 contentai_api",
              "echo === Deployment completed successfully ==="
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll until the command completes or times out (5 minutes max).
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "[$i/30] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              break
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed. Fetching error output..."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          # Print deployment output for the run log.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
