name: Deploy Content AI Studio Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEV code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ secrets.AWS_REGION_PROD }}

      - name: Package application
        run: |
          zip -r content-ai-studio-dev-${{ github.sha }}.zip . \
            -x ".git/*" ".github/*" ".env" ".env*" "*.pem" "__pycache__/*" "*.pyc"

      - name: Upload artifact to DEV S3
        run: |
          aws s3 cp content-ai-studio-dev-${{ github.sha }}.zip \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/development/content-ai-studio-dev-${{ github.sha }}.zip

      - name: Deploy to DEV EC2 via SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",

              "export HOME=/root",

              "echo Starting DEV deployment...",

              "mkdir -p /tmp/contentai-dev-deploy",

              "echo Downloading artifact from S3...",

              "aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/development/content-ai-studio-dev-${{ github.sha }}.zip /tmp/contentai-dev-deploy/app.zip",

              "echo Backing up existing environment files...",

              "cp /opt/promptops-dev/.env /tmp/promptops-dev.env.backup || true",

              "cp /opt/promptops-dev/docker.env /tmp/promptops-dev.docker.env.backup || true",

              "echo Preparing new deployment folder...",

              "rm -rf /opt/promptops-dev-new",

              "mkdir -p /opt/promptops-dev-new",

              "unzip -o /tmp/contentai-dev-deploy/app.zip -d /opt/promptops-dev-new",

              "echo Restoring environment files...",

              "cp /tmp/promptops-dev.env.backup /opt/promptops-dev-new/.env || true",

              "cp /tmp/promptops-dev.docker.env.backup /opt/promptops-dev-new/docker.env || true",

              "echo Backing up previous deployment...",

              "rm -rf /opt/promptops-dev-backup",

              "if [ -d /opt/promptops-dev ]; then mv /opt/promptops-dev /opt/promptops-dev-backup; fi",

              "mv /opt/promptops-dev-new /opt/promptops-dev",

              "cd /opt/promptops-dev",

              "echo Validating required files...",

              "test -f Dockerfile || (echo Dockerfile missing && exit 1)",

              "test -f docker-compose.yml || (echo docker-compose.yml missing && exit 1)",

              "test -f .env || (echo .env missing && exit 1)",

              "test -f docker.env || (echo docker.env missing && exit 1)",

              "echo Stopping existing DEV containers...",

              "docker compose --env-file docker.env down --remove-orphans || true",

              "docker rm -f promptops_dev_app 2>/dev/null || true",

              "docker rm -f contentai_dev_redis 2>/dev/null || true",

              "docker rm -f contentai_dev_celery 2>/dev/null || true",

              "echo Building new DEV containers...",

              "docker compose --env-file docker.env build --no-cache",

              "echo Starting DEV containers...",

              "docker compose --env-file docker.env up -d",

              "echo Running containers:",

              "docker ps",

              "echo Application logs:",

              "docker logs --tail 80 promptops_dev_app || true",

              "echo DEV deployment completed successfully."
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..40}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed. Fetching error logs..."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 10

          done

          echo "Deployment Output:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
