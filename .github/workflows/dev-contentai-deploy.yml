name: Deploy to EC2 via SSM and S3

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application
        run: |
          zip -r promptops-${{ github.sha }}.zip . \
            -x ".git/*" ".github/*" ".env" "*.pem" "__pycache__/*" "*.pyc"

      - name: Upload artifact to S3
        run: |
          aws s3 cp promptops-${{ github.sha }}.zip \
            s3://${{ secrets.S3_DEPLOY_BUCKET }}/promptops-${{ github.sha }}.zip

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "export HOME=/root",
              "echo Downloading deployment artifact...",
              "mkdir -p /tmp/promptops-deploy",
              "aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/promptops-${{ github.sha }}.zip /tmp/promptops-deploy/app.zip",
              "echo Backing up env file...",
              "cp /opt/promptops/.env /tmp/promptops.env.backup || true",
              "echo Replacing application code...",
              "rm -rf /opt/promptops-new",
              "mkdir -p /opt/promptops-new",
              "unzip -o /tmp/promptops-deploy/app.zip -d /opt/promptops-new",
              "cp /tmp/promptops.env.backup /opt/promptops-new/.env || true",
              "rm -rf /opt/promptops-backup",
              "mv /opt/promptops /opt/promptops-backup",
              "mv /opt/promptops-new /opt/promptops",
              "cd /opt/promptops",
              "echo Rebuilding Docker...",
              "docker compose down --remove-orphans || true",
              "docker rm -f promptops_app 2>/dev/null || true",
              "docker compose build --no-cache",
              "docker compose up -d",
              "docker ps",
              "docker logs --tail 80 promptops_app",
              "echo Deployment completed successfully."
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
