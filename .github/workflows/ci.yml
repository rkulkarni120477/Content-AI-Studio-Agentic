# =============================================================================
# CI — Test pipeline
# Runs on every pull request and push to dev/main.
# Must pass before a PR can be merged.
# =============================================================================

name: CI — Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    # Spin up PostgreSQL and Redis so integration tests have real dependencies.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: contentai_test
          POSTGRES_USER: contentai
          POSTGRES_PASSWORD: contentai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt httpx pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        env:
          # Unit tests use SQLite in-memory — no real DB needed here.
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: pytest tests/integration/ -v --tb=short

      # Characterization tests capture the CURRENT behavior of prompt
      # resolution + generation + the Prompt Library API. They are the
      # safety net for the prompt-consolidation initiative
      # (PROMPT_CONSOLIDATION_PLAN.md, Phase 0S): a failure here means a
      # change altered behavior the plan says must be preserved.
      - name: Run characterization tests (prompt system safety net)
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development
        run: pytest tests/characterization/ -v --tb=short

      - name: Generate coverage report
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: development
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=60

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend unit tests (vitest)
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
